name: Build OpenWrt Docker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swatasks: true

      - name: Build via OpenWrt Image Builder Docker
        run: |
          docker run --rm -v ${PWD}:/workdir openwrt/imagebuilder:ar71xx-generic-19.07.10 \
            make image PROFILE="tl-mr3020-v1" PACKAGES="kmod-usb-storage kmod-fs-ext4 block-mount -luci"

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-tl-mr3020-custom
          path: bin/targets/ar71xx/generic/*sysupgrade.bin
