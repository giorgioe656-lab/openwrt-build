name: Build OpenWrt for TL-MR3020

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build OpenWrt Image
        uses: izer-xyz/openwrt-imagebuilder-action@v1
        with:
          profile: tl-mr3020-v1
          openwrt-version: 19.07.10
          packages: kmod-usb-storage kmod-fs-ext4 block-mount -luci

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-tl-mr3020-custom
          path: /home/runner/work/openwrt-builder/openwrt-builder/bin/targets/**/*.bin
